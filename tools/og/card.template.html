<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Outfit';
    src: url('../../node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'Inter';
    src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;

    background: #0C3833;
    color: #FBFAF8;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px;
    position: relative;
  }

  body::after {
    content: '';
    position: absolute;
    inset: auto 0 0 0;
    height: 14px;
    background: linear-gradient(90deg, #176E63 0%, #41A695 45%, #EEB74E 100%);
  }

  .brand { display: flex; align-items: center; gap: 20px; }
  .brand img { width: 72px; height: 72px; display: block; }
  .wordmark {
    font-family: 'Outfit', system-ui, sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 0.06em;
  }
  .wordmark .tuesday { color: #6FC2B2; }

  .eyebrow {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #EEB74E;
    margin-bottom: 24px;
  }

  h1 {
    font-family: 'Outfit', system-ui, sans-serif;
    font-weight: 700;
    font-size: 62px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    max-width: 17ch;

    max-height: 290px;
  }
  h1.long { font-size: 52px; max-width: 21ch; }
</style>
</head>
<body>
  <div class="brand">
    <img src="../../public/favicon.svg" alt="">
    <span class="wordmark">TACO <span class="tuesday">TUESDAY</span></span>
  </div>
  <div>
    <p class="eyebrow">{{eyebrow}}</p>
    <h1 class="{{headlineClass}}">{{headline}}</h1>
  </div>
</body>
</html>
