<footer class="site-footer">
  <div class="tt-container site-footer__inner">
    <div class="site-footer__block">
      <p class="site-footer__name">{{ site.legalName }}</p>
      <p class="site-footer__tagline">
        Entrevistas con fecha, con feedback y sin silencios.
      </p>
    </div>

    <nav class="site-footer__block" aria-label="Contacto y avisos">
      <h2 class="site-footer__heading">Contacto</h2>
      <a [href]="'mailto:' + site.contactEmail">{{ site.contactEmail }}</a>
      <a routerLink="/privacidad">Aviso de privacidad</a>
    </nav>
  </div>

  <div class="tt-container">
    <p class="site-footer__legal">© {{ year }} {{ site.legalName }}. Hecho en México.</p>
  </div>
</footer>
