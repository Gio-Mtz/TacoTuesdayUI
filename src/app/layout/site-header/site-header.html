<header class="site-header">
  <div class="tt-container site-header__inner">
    <a class="site-header__brand" routerLink="/">
      <span class="site-header__mark" aria-hidden="true">TT</span>
      <span class="site-header__name">{{ site.name }}</span>
    </a>

    <nav class="site-header__nav" [attr.aria-label]="copy().navLabel">
      <a routerLink="/" fragment="companies">{{ copy().navCompanies }}</a>
      <a routerLink="/" fragment="engineers">{{ copy().navEngineers }}</a>
      <a routerLink="/" fragment="how-it-works">{{ copy().navHowItWorks }}</a>
    </nav>

    <ttco-theme-toggle />
  </div>
</header>
