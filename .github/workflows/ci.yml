name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Runs first because it is about the environment everything below runs
      # in: `jsdom@30` raised this tree's Node floor to 22.22.2 and nothing in
      # the repo said so, which left `node-version: 22` above green by whatever
      # `setup-node` happens to resolve. Needs only package.json + the lock.
      - name: Node engine guard
        run: npm run check:nodeengine

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

      - name: Contrast guard
        run: npm run check:contrast

      - name: Font size guard
        run: npm run check:fontsize

      - name: Route config guard
        run: npm run check:routes

      # Reads the EMITTED dist, so it has to run after Build. Checks that the
      # hreflang sets are reciprocal and self-contained, and that sitemap.xml
      # and the pages say the same thing -- the two preconditions Google needs
      # before it honours any of them.
      - name: Hreflang guard
        run: npm run check:hreflang

      - name: The postbuild really emitted the social cards
        run: |
          set -e
          for f in dist/TacoTuesdayUI/browser/talento/index.html \
                   dist/TacoTuesdayUI/browser/privacidad/index.html \
                   dist/TacoTuesdayUI/browser/privacy/index.html \
                   dist/TacoTuesdayUI/browser/sitemap.xml \
                   dist/TacoTuesdayUI/browser/robots.txt; do
            test -s "$f" || { echo "::error::missing $f - did postbuild run?"; exit 1; }
          done
          grep -q 'property="og:title"' dist/TacoTuesdayUI/browser/talento/index.html \
            || { echo "::error::talento/index.html has no og:title"; exit 1; }
