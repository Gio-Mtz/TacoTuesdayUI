name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    # Gated on the pull request's AUTHOR, never on `github.actor`. A staging
    # environment is created here and destroyed in the job below, on a later
    # event, and `github.actor` is a different person on those two events: the
    # pusher on `synchronize`, whoever clicked close on `closed`. Gating the two
    # halves of one lifecycle on a value that changes mid-lifecycle is how this
    # app ran out of staging slots. `github.event.pull_request.user.login` is
    # the same string on every event of one pull request, and it is `null` on
    # `push`, so main still deploys. See tools/check-swa-pr-symmetry.mjs.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.action != 'closed'))
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_COAST_0C494471E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: '/' # App source code path
          api_location: '' # Api source code path - optional
          output_location: 'dist/TacoTuesdayUI/browser' # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    # Deliberately gated on NOTHING but the event. Closing an environment that
    # was never created is a no-op; failing to close one that was costs a
    # staging slot forever and eventually blocks an unrelated pull request's
    # deploy with `maximum number of staging environments`. The costs are not
    # symmetric, so this job never asks who is closing.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_COAST_0C494471E }}
          action: 'close'
          app_location: '/' # App source code path

